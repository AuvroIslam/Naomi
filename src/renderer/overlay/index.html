<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Naomi pointer</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="spot"></div>
    <div id="pointer" class="hidden">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="dot"><span class="check">✓</span></div>
      <div class="arrow"></div>
    </div>
    <div id="bubble" class="hidden">
      <div class="label"></div>
      <div class="type"></div>
    </div>
    <div id="confetti"></div>
    <script src="overlay.js"></script>
  </body>
</html>
