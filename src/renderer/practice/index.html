<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'" />
    <title>Practice Mail — a safe place to practise with Naomi</title>
    <link rel="stylesheet" href="practice.css" />
  </head>
  <body>
    <header class="appbar">
      <span class="logo">Practice Mail</span>
      <span class="safe">A pretend email app. Nothing here is really sent.</span>
    </header>
    <div class="app">
      <aside class="side">
        <button class="compose" id="compose">Compose</button>
        <button class="folder active" id="inbox">Inbox</button>
        <button class="folder" id="sent">Sent</button>
      </aside>

      <main class="main" id="main">
        <!-- filled by practice.js -->
      </main>

      <section class="composer" id="composer" hidden>
        <div class="c-head">
          <span>New message</span>
          <button class="c-close" id="closeCompose" aria-label="Close">Close</button>
        </div>
        <label class="c-row"><span>To</span><input id="to" autocomplete="off" spellcheck="false" /></label>
        <label class="c-row"><span>Subject</span><input id="subject" autocomplete="off" /></label>
        <textarea id="body" placeholder="Write your message here"></textarea>
        <div class="c-foot"><button class="send" id="send">Send</button></div>
      </section>

      <div class="toast" id="toast" hidden></div>
    </div>
    <script src="practice.js"></script>
  </body>
</html>
