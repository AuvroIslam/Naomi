<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Naomi</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="size-large">
    <div class="shell" id="shell">
      <header class="top">
        <div class="avatar" id="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <radialGradient id="face" cx="35%" cy="30%" r="80%">
                <stop offset="0" stop-color="#ffb199" />
                <stop offset="0.6" stop-color="#ff6a4d" />
                <stop offset="1" stop-color="#e2482b" />
              </radialGradient>
            </defs>
            <circle cx="32" cy="32" r="30" fill="url(#face)" />
            <circle cx="18" cy="38" r="5" fill="#ff8f78" opacity="0.7" />
            <circle cx="46" cy="38" r="5" fill="#ff8f78" opacity="0.7" />
            <g class="eyes">
              <ellipse class="eye" cx="23" cy="28" rx="3.6" ry="4.6" fill="#1d2140" />
              <ellipse class="eye" cx="41" cy="28" rx="3.6" ry="4.6" fill="#1d2140" />
            </g>
            <path class="mouth" d="M22 40 Q32 48 42 40" stroke="#1d2140" stroke-width="3.4" fill="none" stroke-linecap="round" />
          </svg>
        </div>
        <div class="who">
          <div class="name">Naomi</div>
          <div class="status" id="status">Here to help</div>
        </div>
        <div class="top-actions">
          <button class="chip-btn stop" id="btnStop" hidden>Stop</button>
          <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙</button>
          <button class="icon-btn" id="btnMin" title="Hide Naomi" aria-label="Hide">–</button>
          <button class="icon-btn" id="btnClose" title="Close Naomi" aria-label="Close">×</button>
        </div>
      </header>

      <main class="view" id="view" aria-live="polite"></main>

      <div class="toast" id="toast" hidden></div>

      <footer class="composer" id="composer">
        <button class="mic" id="btnMic" title="Speak instead of typing" aria-label="Speak">🎤</button>
        <textarea id="input" rows="1" placeholder="Tell me what you'd like to do…" aria-label="Message to Naomi"></textarea>
        <button class="send" id="btnSend" title="Send" aria-label="Send">➜</button>
      </footer>

      <section class="drawer" id="settings" hidden>
        <div class="drawer-head">
          <h2>Settings</h2>
          <button class="icon-btn" id="btnCloseSettings" aria-label="Close settings">×</button>
        </div>
        <label class="row toggle">
          <span>Read messages out loud</span>
          <input type="checkbox" id="optVoice" />
        </label>
        <label class="row toggle">
          <span>Extra large text</span>
          <input type="checkbox" id="optXL" />
        </label>
        <label class="row toggle">
          <span>Dim the screen around the dot</span>
          <input type="checkbox" id="optSpot" />
        </label>
        <div class="row memory-row">
          <span>Naomi remembers <b id="memCount">0</b> things about you</span>
          <button class="btn small light" id="btnForget">Forget all</button>
        </div>
        <p class="hint">Tip: press <b>Ctrl + Alt + N</b> any time to bring Naomi back.</p>
        <div class="row col">
          <span>Claude API key <small id="keyState"></small></span>
          <div class="key-row">
            <input type="password" id="optKey" placeholder="sk-ant-…" autocomplete="off" />
            <button class="btn small" id="btnSaveKey">Save</button>
          </div>
          <small class="hint">Naomi uses Claude to see your screen. A family member can set this up once.</small>
        </div>
      </section>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
